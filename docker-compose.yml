name: sofka-banking
version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-banking
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: accountdb
      MYSQL_USER: banking
      MYSQL_PASSWORD: bankingpass
    ports:
      - "3306:3306"
    volumes:
      - ./BaseDatos/accountdb.sql:/docker-entrypoint-initdb.d/accountdb.sql
      - ./BaseDatos/clientdb.sql:/docker-entrypoint-initdb.d/clientdb.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5


  sofka-account-service:
    build:
      context: ./sofka-banking-microservices
      dockerfile: sofka-account-service/Dockerfile
    container_name: sofka-account-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/accountdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: bankingpass
    ports:
      - "8082:8082"

  sofka-client-service:
    build:
      context: ./sofka-banking-microservices
      dockerfile: sofka-client-service/Dockerfile
    container_name: sofka-client-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/clientdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: banking
      SPRING_DATASOURCE_PASSWORD: bankingpass
    ports:
      - "8081:8081"
